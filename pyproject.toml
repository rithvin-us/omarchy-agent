[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omarchy-agent"
version = "0.1.0"
description = "Local, auditable automation foundation for an Omarchy Linux workstation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["omarchy", "linux", "agent", "localai", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]

# Rich renders Markdown, syntax-highlighted blocks, and live status in the chat CLI.
dependencies = [
    "playwright>=1.64.1",
    "rich>=15,<16",
]

[project.optional-dependencies]
# Optional developer tooling only. Not required to run the agent or its tests.
dev = [
  "ruff>=0.6",
]
voice = [
    "faster-whisper>=1.2.1",
    "piper-tts>=1.8.0",
]

[project.scripts]
omarchy-agent = "omarchy_agent.cli:main"
loc = "omarchy_agent.cli:chat_main"

[tool.hatch.build.targets.wheel]
packages = ["omarchy_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]
ignore = [
  # Subprocess use is intentional, reviewed, and always a fixed argument array
  # with shell=False. See bridge/system.py and bridge/git.py.
  "S404",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108"]
